services:
  postgres:
    image: postgres:16-alpine
    container_name: sat-triage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sat_triage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sat_triage_dev}
      POSTGRES_DB: ${POSTGRES_DB:-sat_triage}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - sat_triage_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sat_triage} -d ${POSTGRES_DB:-sat_triage}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  sat_triage_pgdata:
